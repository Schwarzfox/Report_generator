<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Confirmation</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#fff; --ink:#1c2330; --muted:#5b6472; --line:#dfe4ea;
    --brand:#1f6feb; --chip:#eef2f7; --mean:#a3560a;
    --pass:#0f7b3f; --pass-bg:#e6f5ec; --pass-line:#8fcaa8;
    --fail:#b3261e; --fail-bg:#fdeceb; --fail-line:#e39a95;
    --warn:#8a5a00; --warn-bg:#fdf3e0; --warn-line:#e0be7c;
    --t-rule:#e2e6eb; --t-vrule:#eef0f3; --t-edge:#9aa4b2; --t-head-bg:#f2f5f9; --t-zebra:#f8f9fb;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  h1,h2,h3,h4{margin:0 0 .4em}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px}
  button:hover{background:#f0f3f7}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{filter:brightness(1.07)}
  input[type=text],textarea,select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit}
  textarea{resize:vertical;min-height:52px}
  label.fld{display:block;margin:9px 0 3px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}

  .app{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
  .side{background:#eef1f5;border-right:1px solid #d7dde6;padding:18px;overflow-y:auto;max-height:100vh}
  .langbar{display:flex;gap:4px;margin-bottom:10px}
  .langbar button{padding:3px 10px;font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:6px}
  .langbar button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .side h1{font-size:17px}
  .side .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .ver{font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);border:1px solid var(--line);
    border-radius:20px;padding:2px 8px;vertical-align:middle}
  .card{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;overflow:hidden}
  .card>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:8px;user-select:none}
  .card>summary::-webkit-details-marker{display:none}
  .card>summary::after{content:'';margin-left:auto;width:6px;height:6px;flex:none;
    border-right:1.8px solid #9aa4b2;border-bottom:1.8px solid #9aa4b2;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
  .card[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
  .card[open]>summary{color:var(--ink);border-bottom:1px solid var(--line)}
  .card>summary .tag{font-weight:600;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted);
    background:var(--chip);border-radius:20px;padding:1px 7px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .body{padding:12px}
  .drop{border:2px dashed #b9c3d0;border-radius:10px;padding:16px;text-align:center;color:var(--muted);background:#fafbfd;cursor:pointer}
  .drop.over{border-color:var(--brand);background:#eef5ff;color:var(--ink)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .row .grow0{flex:0 0 auto}

  /* per-quantity check rows in the sidebar */
  .qrow{display:grid;grid-template-columns:18px 1fr 92px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .qrow:first-of-type{border-top:none}
  .qrow .qlab{font-size:12.5px;line-height:1.25}
  .qrow .qsub{font-size:11px;color:var(--muted)}
  .qrow.off .qlab,.qrow.off .qsub{opacity:.5}
  .qrow input[type=text]{padding:4px 6px;text-align:right}
  .gsec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .gsec:first-child{margin-top:0;padding-top:0;border-top:none}
  .gname{font-weight:700;font-size:12.5px;margin-bottom:2px}
  .gmeta{font-size:11px;color:var(--muted);margin-bottom:6px}
  /* the coating stack, so the sidebar reads as layer 1 → layer 2 → substrate */
  .lay{border-left:2px solid #c9d3e0;padding-left:8px;margin-bottom:7px}
  .lay .layh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}

  .main{padding:18px;max-height:100vh;overflow:auto}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 auto 14px;width:210mm;max-width:100%}
  .toolbar .sp{flex:1}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .chk input{margin:0}

  /* ---- the sheet: a real A4 page, so the preview matches the print ---- */
  /* Deliberately NOT a flex column: in print the sheet collapses to content height, so any flex
     spacer would push the sign-off to the page foot on screen and nowhere in the PDF. Plain block
     flow means the preview and the printed page agree. */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12mm;margin:0 auto 22px;
    width:210mm;min-height:297mm;max-width:100%;box-shadow:0 2px 10px rgba(20,30,50,.10)}

  /* title on the left, company identity on the right */
  .ac-head{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid var(--t-edge);padding-bottom:8px;margin-bottom:10px}
  .ac-head .ttl{flex:1;min-width:0}
  .ac-head .ttl h2{font-size:17px;letter-spacing:.02em;margin:0}
  .ac-head .ttl .sub{font-size:11.5px;color:var(--muted)}
  .ac-head .co{flex:0 0 auto;text-align:right;max-width:70mm}
  .ac-head .co img.mark{width:44mm;display:block;margin:1mm 0 2px auto}
  .ac-head .co .name{font-weight:600;font-size:11.5px;margin-top:2px}
  .ac-head .co .addr{font-size:10.5px;color:var(--muted)}

  .ac-app{font-size:19px;font-weight:700;letter-spacing:.01em;margin:2px 0 1px}
  .ac-dev{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .ac-meta{font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .ac-meta b{color:var(--ink)}

  .sect-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:12px 0 5px;page-break-after:avoid;break-after:avoid}

  table.data{width:100%;border-collapse:collapse;font-size:11.5px}
  table.data th,table.data td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--t-rule);
    border-right:1px solid var(--t-vrule);white-space:nowrap}
  table.data th:first-child,table.data td:first-child{text-align:left}
  table.data th:last-child,table.data td:last-child{border-right:none}
  table.data thead th{background:var(--t-head-bg);border-bottom:1.5px solid var(--t-edge);font-weight:700;
    font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
  table.data tbody tr:nth-child(even){background:var(--t-zebra)}
  table.data tfoot td{border-top:1.5px solid var(--t-edge);border-bottom:none;font-weight:600;background:#fff}

  .vt{font-weight:700;font-size:11px;letter-spacing:.04em;padding:1px 8px;border-radius:20px;display:inline-block}
  .vt.pass{color:var(--pass);background:var(--pass-bg);border:1px solid var(--pass-line)}
  .vt.fail{color:var(--fail);background:var(--fail-bg);border:1px solid var(--fail-line)}
  .vt.na{color:var(--muted);background:var(--chip);border:1px solid var(--line)}

  .note{margin:8px 0;border-radius:7px;padding:7px 11px;font-size:11.5px;line-height:1.4;
    background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}

  .crit{font-size:10.5px;color:var(--muted);line-height:1.5;text-align:right;margin:12px 0 14px}
  .crit b{color:var(--ink)}

  .signoff{margin-top:10px;border-top:1.5px solid var(--t-edge);padding-top:7px;page-break-inside:avoid}
  .signoff .rem{font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:4px}
  /* sign-off sits on the right, under the company block it belongs to */
  .sigwrap{display:flex;justify-content:flex-end}
  .sigrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:96mm;margin-top:4mm;font-size:10.5px;color:var(--muted)}
  .sigrow .line{border-top:1px solid var(--ink);padding-top:3px}
  .sigrow .val{font-size:12px;color:var(--ink);font-weight:600;min-height:1.2em;margin-bottom:2px}
  .sigrow .sig{grid-column:1 / -1;margin-top:6mm}

  svg.chart{display:block;width:100%;height:auto;page-break-inside:avoid}
  .chart-box{margin-top:8px;page-break-inside:avoid}
  .chart-box h4{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:0 0 2px}
  /* Element symbols and units are case-significant: uppercasing gives "SN" and turns μm into "MM". */
  table.data thead th.u{text-transform:none;letter-spacing:0;font-size:11px}

  .empty{max-width:820px;margin:60px auto;text-align:center;color:var(--muted)}
  .empty h2{color:var(--ink)}

  @media print{
    body{background:#fff}
    .app{display:block}
    .side,.toolbar,.no-print{display:none!important}
    .main{padding:0;max-height:none;overflow:visible}
    .sheet{border:none;box-shadow:none;width:auto;max-width:none;min-height:0;margin:0;padding:0}
    .sheet + .sheet{page-break-before:always}
    body.print-single .sheet{display:none;page-break-before:auto}
    body.print-single .sheet.print-target{display:block}
    table.data tr{page-break-inside:avoid}
    table.data thead{display:table-header-group}
  }
</style>
<style id="pageStyle">@page{size:A4 portrait;margin:12mm}</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="langbar">
      <button id="lang_en" data-lang="en">EN</button><button id="lang_de" data-lang="de">DE</button>
    </div>
    <h1><span data-i18n="ui_appname"></span> <span class="ver" id="appVer"></span></h1>
    <div class="sub" data-i18n="ui_sub"></div>

    <details class="card" id="cardFiles" open>
      <summary><span data-i18n="ui_c_files"></span> <span class="tag" id="tagFiles"></span></summary>
      <div class="body">
        <div class="drop" id="drop" data-i18n-html="ui_drop"></div>
        <input type="file" id="file" accept=".json,application/json" multiple hidden>
        <div class="hint" id="loadInfo" data-i18n="ui_no_meas"></div>
        <div class="row" style="margin-top:9px">
          <button id="clearBtn" type="button" data-i18n="ui_clear"></button>
        </div>
      </div>
    </details>

    <details class="card" id="cardChecks" hidden open>
      <summary><span data-i18n="ui_c_checks"></span> <span class="tag" id="tagChecks"></span></summary>
      <div class="body" id="checksBody"></div>
    </details>

    <details class="card" id="cardSign">
      <summary data-i18n="ui_c_sign"></summary>
      <div class="body">
        <label class="fld" data-i18n="ui_f_engineer"></label>
        <input type="text" id="engineer" data-i18n-ph="ui_ph_engineer">
        <label class="fld" data-i18n="ui_f_title"></label>
        <input type="text" id="engineerTitle" data-i18n-ph="ui_ph_title">
        <label class="fld" data-i18n="ui_f_date"></label>
        <input type="text" id="signdate" data-i18n-ph="ui_ph_date">
        <div class="hint" data-i18n="ui_sign_hint"></div>
      </div>
    </details>

    <details class="card" id="cardOpt" hidden>
      <summary data-i18n="ui_c_opt"></summary>
      <div class="body">
        <label class="chk"><input type="checkbox" id="showCharts"> <span data-i18n="ui_showcharts"></span></label>
        <label class="fld" data-i18n="ui_f_maxuse"></label>
        <input type="number" id="maxUse" min="1" step="1" data-i18n-ph="ui_ph_maxuse">
        <label class="chk"><input type="checkbox" id="rememberMaxUse"> <span data-i18n="ui_remember_maxuse"></span></label>
        <div class="hint" data-i18n="ui_maxuse_hint"></div>
        <div id="remBody"></div>
      </div>
    </details>

  </aside>

  <main class="main">
    <div class="toolbar">
      <span class="sp"></span>
      <button type="button" id="printBtn" class="primary" data-i18n="ui_print"></button>
    </div>
    <div id="out"></div>
  </main>
</div>

<script>
"use strict";
const VERSION='1.1';
const $=id=>document.getElementById(id);

/* ---------- constants ---------- */
const SYM={1:'H',2:'He',3:'Li',4:'Be',5:'B',6:'C',7:'N',8:'O',9:'F',10:'Ne',11:'Na',12:'Mg',13:'Al',14:'Si',15:'P',16:'S',17:'Cl',18:'Ar',19:'K',20:'Ca',21:'Sc',22:'Ti',23:'V',24:'Cr',25:'Mn',26:'Fe',27:'Co',28:'Ni',29:'Cu',30:'Zn',31:'Ga',32:'Ge',33:'As',34:'Se',35:'Br',36:'Kr',37:'Rb',38:'Sr',39:'Y',40:'Zr',41:'Nb',42:'Mo',44:'Ru',45:'Rh',46:'Pd',47:'Ag',48:'Cd',49:'In',50:'Sn',51:'Sb',52:'Te',53:'I',56:'Ba',57:'La',58:'Ce',72:'Hf',73:'Ta',74:'W',75:'Re',76:'Os',77:'Ir',78:'Pt',79:'Au',80:'Hg',81:'Tl',82:'Pb',83:'Bi'};
const sym=z=>SYM[z]||('Z'+z);
const MAKER='HITACHI';

/* ---------- language ----------
   ONE table, keyed by string id, each holding {en,de}. Every user-visible string goes through t().
   Static markup carries data-i18n / data-i18n-ph / data-i18n-html and is refreshed by applyLang().
   Not translated on purpose: HITACHI / FT230 / "Coating Analyzer" notation-adjacent product name is
   translated like the sibling report generator does (rep_model_suffix there); SD, RSD, ±, % — the
   notation is identical in both languages, only the surrounding prose changes. German technical
   documents use a decimal comma, so displayed measurement values are converted too (see fmt()). */
const STR={
  model_suffix:{en:'Coating Analyzer',de:'Schichtdickenmessgerät'},
  ui_appname:{en:'Application Confirmation',de:'Applikationsbestätigung'},
  ui_sub:{en:'Verify a calibration against a certified reference.',de:'Kalibrierung gegen einen zertifizierten Referenzwert prüfen.'},
  ui_c_files:{en:'Measurements',de:'Messungen'},
  ui_drop:{en:'Drop <b>measurement-*.json</b> files here<br>or click to choose',
           de:'<b>measurement-*.json</b>-Dateien hier ablegen<br>oder zum Auswählen klicken'},
  ui_no_meas:{en:'No measurements loaded.',de:'Keine Messungen geladen.'},
  ui_clear:{en:'Clear all',de:'Alles löschen'},
  ui_c_checks:{en:'Certified values',de:'Zertifizierte Werte'},
  ui_c_sign:{en:'Sign-off',de:'Freigabe'},
  ui_f_engineer:{en:'Engineer',de:'Prüfer'},
  ui_ph_engineer:{en:'Name of the responsible engineer',de:'Name des verantwortlichen Prüfers'},
  ui_f_title:{en:'Title',de:'Position'},
  ui_ph_title:{en:'e.g. Application Engineer',de:'z. B. Applikationsingenieur'},
  ui_f_date:{en:'Date',de:'Datum'},
  ui_ph_date:{en:'dd.mm.yyyy',de:'tt.mm.jjjj'},
  ui_sign_hint:{en:'Pre-filled with today — overwrite it if the confirmation is dated differently. Engineer and title are remembered for next time.',
                de:'Mit dem heutigen Datum vorausgefüllt — bei abweichendem Datum überschreiben. Prüfer und Position werden für das nächste Mal gespeichert.'},
  ui_c_opt:{en:'Options & remarks',de:'Optionen & Bemerkungen'},
  ui_showcharts:{en:'Show run charts on the sheet',de:'Verlaufsdiagramme auf dem Blatt anzeigen'},
  ui_f_maxuse:{en:'Measurements to use',de:'Zu verwendende Messungen'},
  ui_ph_maxuse:{en:'all loaded',de:'alle geladenen'},
  ui_remember_maxuse:{en:'Remember my choice',de:'Meine Auswahl merken'},
  ui_maxuse_hint:{en:'Leave blank to use everything loaded. Set a number to cap it (e.g. only the first 10). Tick "Remember my choice" to keep using that number next time, even if more measurements are loaded.',
                  de:'Leer lassen, um alle geladenen Messungen zu verwenden. Zahl eingeben, um zu begrenzen (z. B. nur die ersten 10). „Meine Auswahl merken“ aktivieren, um diese Zahl auch beim nächsten Mal zu verwenden, selbst wenn mehr Messungen geladen werden.'},
  ui_print:{en:'Print / Save PDF',de:'Drucken / Als PDF speichern'},
  ui_empty_h:{en:'No measurements loaded',de:'Keine Messungen geladen'},
  ui_empty_p:{en:'Drop the individual <b>measurement-*.json</b> files on the left. Files are grouped by application / calibration, and each group is printed as its own A4 sheet.',
              de:'Die einzelnen <b>measurement-*.json</b>-Dateien links ablegen. Dateien werden nach Applikation / Kalibrierung gruppiert, jede Gruppe wird als eigenes A4-Blatt gedruckt.'},
  ui_loaded:{en:'{n} measurement(s) loaded',de:'{n} Messung(en) geladen'},
  ui_dups:{en:' · {n} duplicate(s) skipped',de:' · {n} Duplikat(e) übersprungen'},
  ui_skipped:{en:' · {n} file(s) ignored',de:' · {n} Datei(en) ignoriert'},
  ui_none_usable:{en:'No usable measurements found. Use the single measurement-*.json files.',
                  de:'Keine verwertbaren Messungen gefunden. Bitte die einzelnen measurement-*.json-Dateien verwenden.'},
  tag_none:{en:'none',de:'keine'},
  tag_files:{en:'{n} file(s)',de:'{n} Datei(en)'},
  tag_1app:{en:'1 application',de:'1 Applikation'},
  tag_napps:{en:'{n} applications',de:'{n} Applikationen'},
  lbl_layer:{en:'Layer {n} — {name}',de:'Schicht {n} — {name}'},
  lbl_substrate:{en:'Substrate — {name}',de:'Substrat — {name}'},
  lbl_tolerance:{en:'tolerance ±{tol} %',de:'Toleranz ±{tol} %'},
  ph_certified:{en:'certified',de:'zertifiziert'},
  gm_used:{en:'{n} measurement(s) used',de:'{n} Messung(en) verwendet'},
  gm_added:{en:'{tot} added, {n} currently used',de:'{tot} hinzugefügt, {n} aktuell verwendet'},
  gm_below:{en:' · below the {min} required',de:' · unter dem geforderten Minimum von {min}'},
  fld_remarks:{en:'Remarks — {label}',de:'Bemerkungen — {label}'},
  ph_remarks:{en:'Observations, deviations, actions…',de:'Beobachtungen, Abweichungen, Maßnahmen …'},
  q_thickness:{en:'{name} thickness',de:'Schichtdicke {name}'},
  q_content:{en:'{sym} content',de:'{sym}-Gehalt'},
  q_in:{en:'{sym} in {short}',de:'{sym} in {short}'},
  why_substrate:{en:'substrate — not measured',de:'Substrat — nicht gemessen'},
  why_layer:{en:'layer {n}',de:'Schicht {n}'},
  why_pure:{en:'pure element — 100 % by definition',de:'reines Element — per Definition 100 %'},
  why_comp:{en:'composition, layer {n}',de:'Zusammensetzung, Schicht {n}'},
  sheet_title:{en:'CALIBRATION CONFIRMATION',de:'KALIBRIERBESTÄTIGUNG'},
  sheet_sub:{en:'Verification against a certified reference',de:'Verifizierung gegen einen zertifizierten Referenzwert'},
  kind_app:{en:'Application',de:'Applikation'},
  kind_calib:{en:'Calibration',de:'Kalibrierung'},
  sheet_measured:{en:'Measured on <b>{date}</b> · <b>{n}</b> measurements',
                  de:'Gemessen am <b>{date}</b> · <b>{n}</b> Messungen'},
  sect_measurements:{en:'Measurements',de:'Messungen'},
  sect_comparison:{en:'Comparison with the certified value',de:'Vergleich mit dem zertifizierten Wert'},
  th_quantity:{en:'Quantity',de:'Schicht / Element'},
  th_certified:{en:'Certified',de:'Zertifiziert'},
  th_mean:{en:'Mean',de:'Mittelwert'},
  th_sd:{en:'SD',de:'SD'},
  th_rsd:{en:'RSD',de:'RSD'},
  th_deviation:{en:'Deviation',de:'Abweichung'},
  th_tolerance:{en:'Tolerance',de:'Toleranz'},
  th_result:{en:'Result',de:'Ergebnis'},
  val_pass:{en:'PASS',de:'I.O.'},
  val_fail:{en:'FAIL',de:'N.I.O.'},
  note_noqty:{en:'No quantity selected for this application.',de:'Für diese Applikation ist keine Größe ausgewählt.'},
  note_nocert:{en:'Enter a certified value for every selected quantity.',
               de:'Für jede ausgewählte Größe einen zertifizierten Wert eingeben.'},
  crit_main:{en:'Acceptable deviation of the mean from the certified value — first layer ±{a} %, second ±{b} %, third ±{c} %, fourth ±{d} %{comp}. SD: standard deviation of the measurements, RSD: standard deviation divided by the mean.{short}',
             de:'Zulässige Abweichung des Mittelwerts vom zertifizierten Wert — erste Schicht ±{a} %, zweite ±{b} %, dritte ±{c} %, vierte ±{d} %{comp}. SD: Standardabweichung der Messungen, RSD: Standardabweichung geteilt durch den Mittelwert.{short}'},
  crit_comp:{en:', composition ±{tol} %',de:', Zusammensetzung ±{tol} %'},
  crit_short:{en:' Fewer than {min} measurements were made (n = {n}); the minimum is not met and the result above is informative only.',
              de:' Es wurden weniger als {min} Messungen durchgeführt (n = {n}); das Minimum ist nicht erreicht, das obige Ergebnis ist nur informativ.'},
  ch_certified:{en:'certified',de:'zertifiziert'},
  ch_mean:{en:'mean',de:'Mittelwert'},
  ch_title:{en:'{label} ({unit}) — reading order',de:'{label} ({unit}) — Messreihenfolge'},
  sign_engineer:{en:'Engineer',de:'Prüfer'},
  sign_date:{en:'Date',de:'Datum'},
  sign_signature:{en:'Signature',de:'Unterschrift'},
  sign_remarks:{en:'Remarks',de:'Bemerkungen'}
};
const LANGS=['en','de'];
const LANG=()=>(typeof settings!=='undefined'&&LANGS.includes(settings.lang))?settings.lang:'en';
function t(k,vars){
  let s=(STR[k]&&STR[k][LANG()])||(STR[k]&&STR[k].en)||k;
  if(vars)Object.keys(vars).forEach(v=>{s=s.split('{'+v+'}').join(vars[v]);});
  return s;

const CO_NAME='Hitachi High-Tech Analytical Science', CO_ADDR='Wellesweg 31, 47589 Uedem';
const MIN_N=5;                       // fewer than this → warn, verdict still given
let MAX_USE=null;                    // null = no cap, use every loaded measurement; set by the user to limit it
let rememberMaxUse=false;            // when true, MAX_USE is restored from storage instead of defaulting to "all"
const LS_KEY='xrf_appconf_signoff';  // remembers engineer + title + show-charts + the reading cap across sessions (not the date — that's re-defaulted to today)
const TOL_TH=[5,10,15,20];           // by coating depth: 1st layer 5 %, 2nd 10 %, 3rd 15 %, 4th and deeper 20 %
const TOL_COMP=10;                   // chemical composition, all layers

/* ---------- state ---------- */
let MEAS=[];                         // extracted measurements
const checkOn={};                    // groupKey||qKey -> bool   (user override of the auto-detect)
const certVal={};                    // groupKey||qKey -> string (typed certified value)
const remarks={};                    // groupKey       -> string
const settings={engineer:'',engineerTitle:'',signdate:'',lang:'en'};
function loadSignoff(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s){
  settings.engineer=s.engineer||'';settings.engineerTitle=s.engineerTitle||'';
  settings.lang=LANGS.includes(s.lang)?s.lang:'en';showCharts=!!s.showCharts;
  rememberMaxUse=!!s.rememberMaxUse;
  MAX_USE=(rememberMaxUse&&Number.isFinite(s.maxUse)&&s.maxUse>0)?s.maxUse:null;
}}catch(e){}}
function saveSignoff(){try{localStorage.setItem(LS_KEY,JSON.stringify({engineer:settings.engineer,engineerTitle:settings.engineerTitle,showCharts,lang:settings.lang,rememberMaxUse,maxUse:MAX_USE}));}catch(e){}}
let showCharts=false;

/* ---------- helpers ---------- */
// German technical documents use a decimal comma. Applied only to formatted measurement VALUES —
// never to dates (dd.mm.yyyy) or the S/N, both of which legitimately contain dots.
function fmt(x,dec){if(x==null||Number.isNaN(x))return '—';const s=Number(x).toFixed(dec==null?2:dec);return LANG()==='de'?s.replace('.',','):s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stats(vals){
  const v=vals.filter(x=>x!=null&&!Number.isNaN(x)); const n=v.length; if(!n)return null;
  const mean=v.reduce((a,b)=>a+b,0)/n;
  const sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):null;   // null at n=1 — not computable, and "0.00" would read as perfect repeatability
  return {n,mean,sd,rsd:(sd!=null&&mean!==0)?sd/mean*100:null,min:Math.min(...v),max:Math.max(...v)};
}
function fmtDate(ts){
  if(!ts)return '—';
  const [y,m,d]=ts.slice(0,10).split('-');
  return (d&&m&&y)?`${d}.${m}.${y}`:ts.slice(0,10);
}
function todayDE(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;}
function num(s){const v=parseFloat(String(s==null?'':s).replace(',','.'));return Number.isFinite(v)?v:null;}

/* ---------- accept + extract (same JSON contract as the report generator) ---------- */
function accept(d){
  return d && Array.isArray(d.layers) && d.layers.length>0
    && d.metadata && d.metadata.measurementType==='single'
    && d.metadata.analysisResultMetadata && d.metadata.analysisResultMetadata.method
    && d.metadata.analysisResultMetadata.method.name;
}
function extract(d){
  const md=d.metadata;
  const pick=(v,i,def)=>Array.isArray(v)?(v[i]!=null?v[i]:def):(v!=null?v:def);
  const layers=(d.layers||[]).map(L=>{
    const els=L.compoundElements||[];
    const rawUnit=L.compoundMassFractionsUnit, rawDec=L.compoundMassFractionsNumDecimals;
    const full=els.map(sym).join('/')||(L.compoundName||'layer');
    return {
      name: full,
      // a wide-open alloy calibration can define 30+ elements; the full list is useless as a label
      short: els.length>3?els.slice(0,2).map(sym).join('/')+'…':full,
      elements: els.map((z,i)=>({z,sym:sym(z),
        frac:(L.compoundMassFractionsNumbersInUnits||[])[i],
        unit:pick(rawUnit,i,'wt%'), dec:pick(rawDec,i,2)})),
      thickNum:L.thicknessNumberInUnits,
      thickUnit:L.thicknessUnit||'', thickDec:(L.thicknessDecimals!=null?L.thicknessDecimals:2),
      substrate: !((L.thicknessInUnits||'').trim())      // no thickness = base material, not measured
    };
  });
  const dfN=d.dataFieldNames||[], dfV=d.dataFieldValues||[];
  const hw=md.hwSerialNumbers||{};
  return {
    ulid:d.ulid||'', sample:d.sampleName||'(unnamed)',
    device:{type:hw.deviceType||'',sn:hw.deviceSn||''},
    programUlid:d.measurementProgramUlid||'',
    dataFields:dfN.map((n,i)=>({name:n,value:dfV[i]!=null?dfV[i]:''})),
    operator:d.operatorName||'', timestamp:d.timestamp||'',
    methodUlid:d.methodUlid||'', cal:md.analysisResultMetadata.method.name,
    calDate:md.instrumentCalibrationDate||'', hcDate:md.healthCheckDate||'',
    layers
  };
}

/* ---------- grouping ---------- */
function groups(){
  const map=new Map();
  for(const m of MEAS){
    const k=(m.methodUlid||m.cal)+'||'+(m.programUlid||'');
    if(!map.has(k))map.set(k,{key:k,cal:m.cal,app:!!m.programUlid,methodUlid:m.methodUlid||'',items:[]});
    map.get(k).items.push(m);
  }
  for(const g of map.values())
    g.items.sort((a,b)=>(a.timestamp<b.timestamp?-1:a.timestamp>b.timestamp?1:0));   // oldest first → reading #1 is the oldest
  return [...map.values()];
}
function groupLabel(g,gs){
  const clash=(gs||groups()).filter(x=>x.cal===g.cal).length>1;
  return g.cal+(clash&&g.methodUlid?` · ${g.methodUlid.slice(-8)}`:'');
}

/* ---------- quantities + auto-detect ----------
   A layer with no thickness is the substrate: base material, nothing measured on it.
   A coating layer's thickness is always checked. Its composition is only checked when the
   layer really has a composition to measure — a pure Au or Sn layer reads 100 % by definition. */
function quantities(g){
  const ref=g.items[0], qs=[]; let depth=0;
  ref.layers.forEach((L,i)=>{
    if(L.substrate){
      L.elements.forEach((el,j)=>qs.push({key:`${i}:el${j}`,label:t('q_in',{sym:el.sym,short:L.short}),unit:el.unit,dec:el.dec,
        kind:'el',li:i,ej:j,tol:TOL_COMP,defOn:false,why:t('why_substrate')}));
      return;
    }
    depth++;
    const tol=TOL_TH[Math.min(depth,TOL_TH.length)-1];
    qs.push({key:`${i}:th`,label:t('q_thickness',{name:L.name}),unit:L.thickUnit,dec:L.thickDec,
      kind:'th',li:i,depth,tol,defOn:true,why:t('why_layer',{n:depth})});
    const pure=L.elements.length<2;
    L.elements.forEach((el,j)=>qs.push({key:`${i}:el${j}`,label:pure?t('q_content',{sym:el.sym}):t('q_in',{sym:el.sym,short:L.short}),unit:el.unit,dec:el.dec,
      kind:'el',li:i,ej:j,depth,tol:TOL_COMP,defOn:!pure,
      why:pure?t('why_pure'):t('why_comp',{n:depth})}));
  });
  return qs;
}
// A confirmation is built on 5–10 readings. Extra repeats are kept in the file list but not evaluated.
function used(g){return MAX_USE?g.items.slice(0,MAX_USE):g.items;}
function isOn(g,q){const k=g.key+'||'+q.key; if(!(k in checkOn))checkOn[k]=q.defOn; return checkOn[k];}
function certOf(g,q){return certVal[g.key+'||'+q.key]||'';}
function qVal(m,q){
  const L=m.layers[q.li]; if(!L)return null;
  if(q.kind==='th')return L.thickNum!=null?L.thickNum:null;
  const el=L.elements[q.ej]; return el&&el.frac!=null?el.frac:null;
}

/* ---------- the verdict ----------
   Accuracy is judged on the mean only. SD / RSD are reported, not judged. */
function evaluate(g,q){
  const s=stats(used(g).map(m=>qVal(m,q)));
  const c=num(certOf(g,q));
  if(!s)return {s:null,c,dev:null,verdict:'na'};
  if(c==null||c===0)return {s,c:null,dev:null,verdict:'na'};
  const dev=(s.mean-c)/c*100;
  return {s,c,dev,verdict:Math.abs(dev)<=q.tol?'pass':'fail'};
}
function groupVerdict(g){
  const rows=quantities(g).filter(q=>isOn(g,q)).map(q=>({q,e:evaluate(g,q)}));
  const n=used(g).length;
  if(!rows.length)      return {state:'na',rows,n,why:t('note_noqty')};
  if(rows.some(r=>r.e.verdict==='na')) return {state:'na',rows,n,why:t('note_nocert')};
  return {state:rows.every(r=>r.e.verdict==='pass')?'pass':'fail',rows,n,why:''};
}

/* ---------- loading ---------- */
async function loadFiles(fileList){
  const seen=new Set(MEAS.map(m=>m.ulid).filter(Boolean));
  let dups=0, skipped=0;
  for(const f of [...fileList]){
    let d; try{d=JSON.parse(await f.text());}catch(e){skipped++;continue;}
    if(!accept(d)){skipped++;continue;}                 // lmm-, averages and anything else are ignored
    const m=extract(d);
    if(m.ulid&&seen.has(m.ulid)){dups++;continue;}
    if(m.ulid)seen.add(m.ulid);
    MEAS.push(m);
  }
  $('loadInfo').textContent=MEAS.length
    ? `${t('ui_loaded',{n:MEAS.length})}${dups?t('ui_dups',{n:dups}):''}${skipped?t('ui_skipped',{n:skipped}):''}.`
    : t('ui_none_usable');
  render();
}

/* ---------- sidebar ---------- */
function renderSidebar(gs){
  $('cardChecks').hidden=!gs.length;
  $('cardOpt').hidden=!gs.length;
  $('tagFiles').textContent=MEAS.length?t('tag_files',{n:MEAS.length}):t('tag_none');
  $('tagChecks').textContent=gs.length===1?t('tag_1app'):t('tag_napps',{n:gs.length});

  // Quantities are listed under their own layer, so the coating stack itself is readable:
  // Layer 1 Sn → Layer 2 Ni → Substrate Cu/Zn.
  $('checksBody').innerHTML=gs.map(g=>{
    const qs=quantities(g), ref=g.items[0], n=used(g).length;
    const qrow=q=>{
      const on=isOn(g,q);
      return `<div class="qrow ${on?'':'off'}">
        <input type="checkbox" data-chk="${esc(g.key+'||'+q.key)}" ${on?'checked':''}>
        <div><div class="qlab">${esc(q.label)} <span class="qsub">(${esc(q.unit)})</span></div>
             <div class="qsub">${on?esc(t('lbl_tolerance',{tol:q.tol})):esc(q.why)}</div></div>
        <input type="text" data-cert="${esc(g.key+'||'+q.key)}" value="${esc(certOf(g,q))}"
               placeholder="${esc(t('ph_certified'))}" ${on?'':'disabled'}>
      </div>`;
    };
    let depth=0;
    const stack=ref.layers.map((L,i)=>{
      const mine=qs.filter(q=>q.li===i);
      const head=L.substrate?t('lbl_substrate',{name:L.short}):t('lbl_layer',{n:++depth,name:L.short});
      return `<div class="lay"><div class="layh">${esc(head)}</div>${mine.map(qrow).join('')}</div>`;
    }).join('');
    return `<div class="gsec">
      <div class="gname">${esc(groupLabel(g,gs))}</div>
      <div class="gmeta">${esc(g.items.length>n?t('gm_added',{tot:g.items.length,n}):t('gm_used',{n}))}${n<MIN_N?esc(t('gm_below',{min:MIN_N})):''}</div>
      ${stack}
    </div>`;
  }).join('');

  $('remBody').innerHTML=gs.map(g=>`
    <label class="fld">${esc(t('fld_remarks',{label:groupLabel(g,gs)}))}</label>
    <textarea data-rem="${esc(g.key)}" placeholder="${esc(t('ph_remarks'))}">${esc(remarks[g.key]||'')}</textarea>
  `).join('');

  $('checksBody').querySelectorAll('[data-chk]').forEach(el=>el.onchange=()=>{checkOn[el.dataset.chk]=el.checked;render();});
  $('checksBody').querySelectorAll('[data-cert]').forEach(el=>{
    el.oninput=()=>{certVal[el.dataset.cert]=el.value;renderSheets(groups());};
  });
  $('remBody').querySelectorAll('[data-rem]').forEach(el=>{
    el.oninput=()=>{remarks[el.dataset.rem]=el.value;renderSheets(groups());};
  });
}

/* ---------- the sheet ---------- */
function headerBlock(g){
  const items=used(g);
  const devs=[...new Map(items.map(m=>[m.device.type+'|'+m.device.sn,m.device])).values()];
  const dev=devs.map(d=>`${MAKER} ${esc(d.type)} ${t('model_suffix')} · S/N ${esc(d.sn)}`).join('  |  ');
  // Measurements run through an application carry a measurementProgramUlid; without one the
  // operator picked the calibration directly. The sheet names whichever it actually was.
  const kind=g.app?t('kind_app'):t('kind_calib');
  return `
  <div class="ac-head">
    <div class="ttl">
      <h2>${t('sheet_title')}</h2>
      <div class="sub">${t('sheet_sub')}</div>
    </div>
    <div class="co">
      <img class="mark" src="${CO_LOGO}" alt="HITACHI">
      <div class="name">${CO_NAME}</div>
      <div class="addr">${CO_ADDR}</div>
    </div>
  </div>
  <div class="ac-app">${esc(kind)}: ${esc(groupLabel(g))}</div>
  <div class="ac-dev">${dev||'—'}</div>
  <div class="ac-meta">${t('sheet_measured',{date:fmtDate(items[0].timestamp),n:items.length})}</div>`;
}

function readingsTable(g,rows){
  if(!rows.length)return '';
  return `
  <div class="sect-h">${t('sect_measurements')}</div>
  <table class="data">
    <thead><tr><th>#</th>${rows.map(r=>`<th class="u">${esc(r.q.label)} (${esc(r.q.unit)})</th>`).join('')}</tr></thead>
    <tbody>${used(g).map((m,i)=>`<tr><td>${i+1}</td>${rows.map(r=>`<td>${fmt(qVal(m,r.q),r.q.dec)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function verdictTable(rows){
  return `
  <div class="sect-h" style="margin-top:22px">${t('sect_comparison')}</div>
  <table class="data">
    <thead><tr>
      <th>${t('th_quantity')}</th><th>${t('th_certified')}</th><th>${t('th_mean')}</th><th>${t('th_sd')}</th><th>${t('th_rsd')}</th>
      <th>${t('th_deviation')}</th><th>${t('th_tolerance')}</th><th>${t('th_result')}</th>
    </tr></thead>
    <tbody>${rows.map(({q,e})=>{
      const d=e.dev==null?'—':`${e.dev>=0?'+':'−'}${fmt(Math.abs(e.dev),2)} %`;
      return `<tr>
        <td>${esc(q.label)} <span style="color:var(--muted)">(${esc(q.unit)})</span></td>
        <td><b>${e.c==null?'—':fmt(e.c,q.dec)}</b></td>
        <td><b>${e.s?fmt(e.s.mean,q.dec):'—'}</b></td>
        <td>${e.s&&e.s.sd!=null?fmt(e.s.sd,q.dec):'—'}</td>
        <td>${e.s&&e.s.rsd!=null?fmt(e.s.rsd,2)+' %':'—'}</td>
        <td>${d}</td>
        <td>±${q.tol} %</td>
        <td><span class="vt ${e.verdict}">${e.verdict==='na'?'—':t(e.verdict==='pass'?'val_pass':'val_fail')}</span></td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

/* run chart: readings in measurement order, with the certified value and its tolerance band */
function runChart(g,q,e){
  const vals=used(g).map(m=>qVal(m,q));
  const W=560,H=80,L=46,R=46,T=9,B=10;   // right gutter carries the "mean" / "certified" labels
  const pts=vals.map((v,i)=>({i,v})).filter(p=>p.v!=null);
  if(pts.length<2)return '';
  const lo=e.c!=null?e.c*(1-q.tol/100):null, hi=e.c!=null?e.c*(1+q.tol/100):null;
  const mean=e.s?e.s.mean:null;
  const all=pts.map(p=>p.v).concat(lo!=null?[lo,hi,e.c]:[]).concat(mean!=null?[mean]:[]);
  let mn=Math.min(...all), mx=Math.max(...all); const pad=(mx-mn||Math.abs(mx)||1)*0.15;
  mn-=pad; mx+=pad;
  const x=i=>L+(W-L-R)*(vals.length>1?i/(vals.length-1||1):0.5);
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  // colours go in style="" not fill="" — var() does not resolve in SVG presentation attributes
  const band=lo!=null?`<rect x="${L}" y="${y(hi)}" width="${W-L-R}" height="${Math.max(0,y(lo)-y(hi))}" style="fill:var(--pass-bg);stroke:var(--pass-line);stroke-width:.6"/>`:'';
  // Both reference lines are named — a dashed line with no label is unreadable on a printed sheet.
  // A good calibration puts mean and certified almost on top of each other, so the two labels must
  // be pushed apart or they overprint each other exactly when the result is best.
  let yc=e.c!=null?y(e.c)+3:null, ym=mean!=null?y(mean)+3:null;
  if(yc!=null&&ym!=null&&Math.abs(yc-ym)<9){const up=ym<=yc?-1:1; ym+=4.5*up; yc-=4.5*up;}
  // Labels name the line only. The values are in the table directly above, and at this size a
  // repeated number is unreadable rather than informative.
  const cline=e.c!=null?`<line x1="${L}" x2="${W-R}" y1="${y(e.c)}" y2="${y(e.c)}" style="stroke:var(--pass);stroke-width:1" stroke-dasharray="4 3"/>
    <text x="${W-R+5}" y="${yc.toFixed(1)}" font-size="8.5" style="fill:var(--pass)">${esc(t('ch_certified'))}</text>`:'';
  // the mean gets its own colour — blue is already the measured series, and two blue lines read as one broken line
  const mline=mean!=null?`<line x1="${L}" x2="${W-R}" y1="${y(mean)}" y2="${y(mean)}" style="stroke:var(--mean);stroke-width:1.1"/>
    <text x="${W-R+5}" y="${ym.toFixed(1)}" font-size="8.5" style="fill:var(--mean)">${esc(t('ch_mean'))}</text>`:'';
  const path=pts.map((p,k)=>`${k?'L':'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const dots=pts.map(p=>{
    const out=lo!=null&&(p.v<lo||p.v>hi);
    return `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.4" style="fill:var(${out?'--fail':'--brand'})"/>`;
  }).join('');
  const ax=[mn,mx].map(v=>`<text x="${L-5}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="8" fill="#5b6472">${fmt(v,q.dec)}</text>`).join('');
  return `<div class="chart-box"><h4>${esc(t('ch_title',{label:q.label,unit:q.unit}))}</h4>
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${band}${cline}${mline}
      <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#c8cfd8"/>
      <line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#c8cfd8"/>
      ${ax}
      <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="1.3"/>
      ${dots}
    </svg></div>`;   /* no x-axis caption — the heading already says "reading order" */
}

function criteriaBlock(n,rows){
  const short=n<MIN_N?t('crit_short',{min:MIN_N,n}):'';
  // the composition limit is only stated when a composition row is actually being judged —
  // an unstated criterion on a customer document is worse than one extra clause
  const comp=rows.some(r=>r.q.kind==='el')?t('crit_comp',{tol:TOL_COMP}):'';
  return `<div class="crit">${esc(t('crit_main',{a:TOL_TH[0],b:TOL_TH[1],c:TOL_TH[2],d:TOL_TH[3],comp,short}))}</div>`;
}

function signBlock(g){
  const rem=(remarks[g.key]||'').trim();
  return `<div class="signoff">
    ${rem?`<div class="sect-h" style="margin-top:0">${t('sign_remarks')}</div><div class="rem">${esc(rem)}</div>`:''}
    <div class="sigwrap"><div class="sigrow">
      <div><div class="val">${esc(settings.engineer)||'&nbsp;'}</div><div class="line">${esc(settings.engineerTitle)||t('sign_engineer')}</div></div>
      <div><div class="val">${esc(settings.signdate)||'&nbsp;'}</div><div class="line">${t('sign_date')}</div></div>
      <div class="sig"><div class="line">${t('sign_signature')}</div></div>
    </div></div>
  </div>`;
}

function sheet(g,gi,gs){
  const v=groupVerdict(g);
  const rows=v.rows;
  const incomplete=v.state==='na'?`<div class="note">${esc(v.why)}</div>`:'';
  const charts=showCharts?rows.map(r=>runChart(g,r.q,r.e)).join(''):'';
  return `<section class="sheet" data-gi="${gi}">
    ${headerBlock(g)}
    ${rows.length?verdictTable(rows):''}
    ${incomplete}
    ${criteriaBlock(v.n,rows)}
    ${readingsTable(g,rows)}
    ${charts}
    ${signBlock(g)}
  </section>`;
}

function renderSheets(gs){
  $('out').innerHTML=gs.length
    ? gs.map((g,i)=>sheet(g,i,gs)).join('')
    : `<div class="empty"><h2>${esc(t('ui_empty_h'))}</h2><p>${t('ui_empty_p')}</p></div>`;
}
function render(){const gs=groups();renderSidebar(gs);renderSheets(gs);}

/* ---------- language wiring ---------- */
function applyLang(){
  document.documentElement.lang=LANG();
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  LANGS.forEach(l=>$('lang_'+l).classList.toggle('active',LANG()===l));
  document.title=`${t('ui_appname')} v${VERSION}`;
}
LANGS.forEach(l=>{$('lang_'+l).onclick=()=>{
  if(LANG()===l)return;
  settings.lang=l;
  saveSignoff();
  applyLang();
  render();
};});

/* ---------- wiring ---------- */
$('appVer').textContent='v'+VERSION;
loadSignoff();
applyLang();
$('engineer').value=settings.engineer;
$('engineerTitle').value=settings.engineerTitle;
$('showCharts').checked=showCharts;
$('rememberMaxUse').checked=rememberMaxUse;
if(MAX_USE!=null)$('maxUse').value=MAX_USE;
$('signdate').value=settings.signdate=todayDE();

$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{loadFiles(e.target.files);e.target.value='';};
['dragenter','dragover'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over');}));
$('drop').addEventListener('drop',e=>loadFiles(e.dataTransfer.files));
$('clearBtn').onclick=()=>{MEAS=[];$('loadInfo').textContent=t('ui_no_meas');render();};

['engineer','signdate'].forEach(k=>{$(k).oninput=()=>{settings[k]=$(k).value;renderSheets(groups());};});
$('engineerTitle').oninput=()=>{settings.engineerTitle=$('engineerTitle').value;renderSheets(groups());};
['engineer','engineerTitle'].forEach(k=>$(k).addEventListener('change',saveSignoff));
$('showCharts').onchange=e=>{showCharts=e.target.checked;saveSignoff();renderSheets(groups());};
$('maxUse').onchange=e=>{
  const n=parseInt(e.target.value,10);
  MAX_USE=Number.isFinite(n)&&n>0?n:null;
  if(rememberMaxUse)saveSignoff();
  render();
};
$('rememberMaxUse').onchange=e=>{rememberMaxUse=e.target.checked;saveSignoff();};
$('printBtn').onclick=()=>window.print();

render();
</script>
